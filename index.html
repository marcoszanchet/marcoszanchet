<style>
/* Layout: caderno de estudo — cabeçalho com progresso do dia, abas de exercício, uma área de prática por vez. Marca-texto amarelo destaca o que importa. */
:root {
  --paper: #F4F6FB;
  --surface: #FFFFFF;
  --ink: #16213E;
  --muted: #56617F;
  --line: #DCE1EE;
  --cobalt: #2743D8;
  --cobalt-soft: #E6EAFD;
  --marker: #FFE45C;
  --marker-ink: #16213E;
  --good: #17805A;
  --good-soft: #E1F4EC;
  --bad: #BE3434;
  --bad-soft: #FBE7E7;

  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono: "Noto Sans Mono", "DejaVu Sans Mono", ui-monospace, monospace;

  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1325; --surface: #161D35; --ink: #E8EBF5; --muted: #9AA3C2; --line: #29325A;
    --cobalt: #93A5FF; --cobalt-soft: #1F2A55; --marker: #E6C83A; --marker-ink: #14182A;
    --good: #4CC48F; --good-soft: #13382B; --bad: #F07A7A; --bad-soft: #43191D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1325; --surface: #161D35; --ink: #E8EBF5; --muted: #9AA3C2; --line: #29325A;
  --cobalt: #93A5FF; --cobalt-soft: #1F2A55; --marker: #E6C83A; --marker-ink: #14182A;
  --good: #4CC48F; --good-soft: #13382B; --bad: #F07A7A; --bad-soft: #43191D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.55 var(--f-body);
  padding: 0 16px;
  padding-block: 20px 48px;
}
.wrap { max-width: 760px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--cobalt); outline-offset: 2px; }
.mark { background: linear-gradient(transparent 55%, var(--marker) 55%); color: inherit; padding: 0 2px; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.ipa { font-family: var(--f-mono); color: var(--muted); font-size: 15px; }

/* Cabeçalho */
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; }
header h1 { font-size: clamp(30px, 6vw, 44px); font-weight: 800; letter-spacing: -.02em; }
header p { margin: 4px 0 0; color: var(--muted); }
.today { display: flex; gap: 14px; align-items: center; }
.ring { width: 64px; height: 64px; flex: none; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--line); }
.ring .fg { stroke: var(--cobalt); stroke-linecap: round; transition: stroke-dashoffset .5s; }
.ring text { fill: var(--ink); font: 700 14px var(--f-display); }
.today-meta { display: grid; font-variant-numeric: tabular-nums; font-size: 14px; color: var(--muted); }
.today-meta b { color: var(--ink); }

/* Nível */
.levels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lvl {
  display: grid; gap: 2px; text-align: left; padding: 10px 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface); min-width: 0;
}
.lvl:hover { border-color: var(--cobalt); }
.lvl b { font-family: var(--f-display); font-size: 17px; }
.lvl .cefr { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.lvl .meter { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.lvl .meter .progress { flex: 1; height: 4px; }
.lvl .meter .progress > i { background: var(--good); }
.lvl[aria-checked="true"] { border: 2px solid var(--cobalt); background: var(--cobalt-soft); padding: 9px 13px; }
@media (max-width: 480px) { .levels { grid-template-columns: 1fr 1.3fr 1fr; gap: 6px; } .lvl { padding: 8px 10px; } .lvl[aria-checked="true"] { padding: 7px 9px; } .lvl b { font-size: 14px; } .lvl .meter span { display: none; } }

/* Abas */
nav { display: flex; gap: 6px; flex-wrap: wrap; border-bottom: 2px solid var(--line); }
nav button {
  background: none; border: 0; padding: 10px 14px; font-weight: 700; color: var(--muted);
  border-bottom: 3px solid transparent; margin-bottom: -2px;
}
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--cobalt); }
nav button:hover { color: var(--ink); }

/* Painel */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; display: grid; gap: 18px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.spread { justify-content: space-between; }
select {
  font: inherit; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--paper); color: var(--ink);
}
.btn {
  border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 10px 16px; font-weight: 700;
}
.btn:hover { border-color: var(--cobalt); }
.btn.primary { background: var(--cobalt); border-color: var(--cobalt); color: var(--surface); }
.btn.good { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.btn[disabled] { opacity: .5; cursor: default; }
.icon-btn {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 700; color: var(--cobalt);
}
.icon-btn svg { width: 16px; height: 16px; fill: currentColor; }
.progress { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--cobalt); transition: width .3s; }
.hint { color: var(--muted); font-size: 14px; margin: 0; }
kbd { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; }

/* Cartões */
.card {
  border: 2px dashed var(--line); border-radius: var(--r); min-height: 220px; padding: 26px 20px;
  display: grid; place-items: center; text-align: center; gap: 10px; background: var(--paper);
  cursor: pointer; user-select: none;
}
.card .word { font-family: var(--f-display); font-size: clamp(30px, 7vw, 46px); font-weight: 700; letter-spacing: -.01em; }
.card .back { display: grid; gap: 8px; }
.card .pt { font-size: 22px; font-weight: 700; }
.card .ex { font-style: italic; color: var(--muted); max-width: 46ch; margin: 0 auto; }
.boxes { display: flex; gap: 4px; }
.boxes i { width: 18px; height: 6px; border-radius: 3px; background: var(--line); }
.boxes i.on { background: var(--good); }

/* Quiz / frases */
.prompt { font-family: var(--f-display); font-size: clamp(24px, 5vw, 32px); font-weight: 700; }
.sentence { font-size: 22px; line-height: 1.5; }
.blank { display: inline-block; min-width: 90px; border-bottom: 3px solid var(--cobalt); text-align: center; }
.options { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.opt {
  text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 14px 16px;
  display: flex; gap: 12px; align-items: baseline;
}
.opt:hover:not([disabled]) { border-color: var(--cobalt); }
.opt .k { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.opt.right { background: var(--good-soft); border-color: var(--good); }
.opt.wrong { background: var(--bad-soft); border-color: var(--bad); }
.opt[disabled] { cursor: default; }
.feedback { border-radius: 12px; padding: 14px 16px; }
.feedback.ok { background: var(--good-soft); color: var(--ink); border-left: 4px solid var(--good); }
.feedback.no { background: var(--bad-soft); color: var(--ink); border-left: 4px solid var(--bad); }
.feedback p { margin: 4px 0 0; }

/* Ditado */
.dict-input {
  width: 100%; font: 20px var(--f-body); padding: 14px 16px; border-radius: 12px;
  border: 2px solid var(--line); background: var(--paper); color: var(--ink);
}
.diff { font-size: 20px; line-height: 1.9; }
.diff .w-ok { color: var(--good); }
.diff .w-miss { background: var(--marker); color: var(--marker-ink); border-radius: 4px; padding: 0 4px; }
.diff .w-extra { color: var(--bad); text-decoration: line-through; }

/* Pronúncia */
.seg { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 4px; padding: 4px; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; }
.seg button { border: 0; background: none; border-radius: 9px; padding: 8px 6px; font-weight: 700; color: var(--muted); line-height: 1.2; }
.seg button[aria-checked="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(22, 33, 62, .15); }
.syls { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.syls .dot { color: var(--muted); font-size: 24px; }
.syl {
  font: 700 26px var(--f-display); padding: 10px 18px; min-width: 64px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--paper);
}
.syl:hover:not([disabled]) { border-color: var(--cobalt); }
.syl.right { background: var(--good-soft); border-color: var(--good); }
.syl.wrong { background: var(--bad-soft); border-color: var(--bad); }
.syl[disabled] { cursor: default; }

/* Início */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 480px) { .stat { padding: 10px; } .stat b { font-size: 24px; } .stat span { font-size: 12px; } }
.stat { border: 1px solid var(--line); border-radius: 12px; padding: 14px; background: var(--paper); }
.stat b { display: block; font: 800 30px var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 14px; }
.cats { display: grid; gap: 12px; }
.cat { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; }
.cat .progress { grid-column: 1 / -1; height: 8px; }
.cat .progress > i { background: var(--good); }
.cat small { color: var(--muted); font-variant-numeric: tabular-nums; }
.tip { background: var(--cobalt-soft); border-radius: 12px; padding: 16px 18px; }
.tip p { margin: 6px 0 0; }
.done { text-align: center; display: grid; gap: 12px; justify-items: center; padding-block: 20px; }
.done .big { font: 800 56px var(--f-display); color: var(--cobalt); font-variant-numeric: tabular-nums; }
.install { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; background: var(--cobalt-soft); border-radius: var(--r); padding: 16px 18px; }
.install p { margin: 2px 0 0; }
footer { color: var(--muted); font-size: 13px; text-align: center; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div class="wrap">
  <header>
    <div>

  <div class="install" id="install" hidden>

    <button class="btn primary" id="install-btn">Instalar</button>
  </div>

  <footer>Seu progresso fica salvo neste aparelho. A pronúncia usa a voz em inglês do seu dispositivo.</footer>
</div>

/* ---------- Estado salvo ---------- */
const KEY = "caderno-ingles-v1";
const GOAL = 50;
function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") return s; } catch (e) {}
  return {};
}
const S = Object.assign({ boxes: {}, xpByDay: {}, answered: 0, correct: 0, lastDay: null, streak: 0, tab: "home" }, load());
if (!LEVELS[S.level]) S.level = Object.keys(S.boxes).length ? 2 : 1;
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function dayKey(d = new Date()) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

function addXP(n, ok) {
  const today = dayKey();
  if (S.lastDay !== today) {
    const y = new Date(); y.setDate(y.getDate() - 1);
    S.streak = S.lastDay === dayKey(y) ? S.streak + 1 : 1;
    S.lastDay = today;
  }
  S.xpByDay[today] = (S.xpByDay[today] || 0) + n;
  if (ok !== undefined) { S.answered++; if (ok) S.correct++; }
  save(); renderHeader();
}

function renderHeader() {
  const xp = S.xpByDay[dayKey()] || 0;
  const pct = Math.min(1, xp / GOAL);
  document.getElementById("ring-fg").setAttribute("stroke-dashoffset", (169.6 * (1 - pct)).toFixed(1));
  document.getElementById("ring-txt").textContent = Math.round(pct * 100) + "%";
  document.getElementById("xp-today").textContent = xp;
  document.getElementById("xp-goal").textContent = GOAL;
  const y = new Date(); y.setDate(y.getDate() - 1);
  const alive = S.lastDay === dayKey() || S.lastDay === dayKey(y);
  const st = alive ? S.streak : 0;
  document.getElementById("streak").textContent = st;
  document.getElementById("streak-word").textContent = st === 1 ? "dia" : "dias";
}

const $view = document.getElementById("view");
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const levelCats = (lv = S.level) => Object.entries(CATS).filter(([, c]) => c.level === +lv);
const allWords = (lv) => levelCats(lv).flatMap(([k, c]) => c.words.map(w => ({ cat: k, en: w[0], ipa: w[1], pt: w[2], ex: w[3] })));
const box = en => S.boxes[en] || 0;

let voice = null;
function pickVoice() {
  if (!("speechSynthesis" in window)) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  voice = vs.find(v => /en[-_]US/i.test(v.lang) && /natural|google|samantha|aria|jenny/i.test(v.name))
       || vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
}
if ("speechSynthesis" in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(text, slow) {
  if (!("speechSynthesis" in window)) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US"; if (voice) u.voice = voice;
  u.rate = slow ? 0.7 : LEVELS[S.level].rate;
  speechSynthesis.speak(u);
  return true;
}
const canSpeak = "speechSynthesis" in window;

function catSelect(id, value, withAll = true) {
  return `<select id="${id}" aria-label="Categoria">${withAll ? `<option value="all">Todas as categorias</option>` : ""}${
    levelCats().map(([k, c]) => `<option value="${k}" ${k === value ? "selected" : ""}>${c.name}</option>`).join("")}</select>`;
}

  const words = allWords();
  const mastered = words.filter(w => box(w.en) >= 4).length;
  const acc = S.answered ? Math.round(100 * S.correct / S.answered) : null;
  const totalXP = Object.values(S.xpByDay).reduce((a, b) => a + b, 0);
  const tip = TIPS[new Date().getDate() % TIPS.length];
  $view.innerHTML = `
    <div class="row spread">

    <div class="cats">

}

/* ---------- Cartões (repetição espaçada simples) ---------- */

    const flip = () => { C.flipped = true; renderCards(); if (C.dir === "pt") speak(w.en); };
    document.getElementById("card").onclick = () => { if (!C.flipped) flip(); };
    document.getElementById("card").onkeydown = e => { if (e.key === "Enter" && !C.flipped) flip(); };
    document.getElementById("say").onclick = () => speak(w.en);
    document.getElementById("say-ex").onclick = () => speak(w.ex);

/* ---------- Quiz de vocabulário ---------- */
let Q = null;

/* ---------- Gramática ---------- */
let G = null;

/* ---------- Ditado ---------- */
let D = null;
const norm = s => s.toLowerCase().replace(/[’']/g, "").replace(/[^a-z0-9\s]/g, " ").split(/\s+/).filter(Boolean);
function diffWords(target, typed) {
  const A = norm(target), B = norm(typed);
  const L = Array.from({ length: A.length + 1 }, () => new Array(B.length + 1).fill(0));
  for (let i = A.length - 1; i >= 0; i--) for (let j = B.length - 1; j >= 0; j--)
    L[i][j] = A[i] === B[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
  const out = []; let i = 0, j = 0;
  while (i < A.length || j < B.length) {
    if (i < A.length && j < B.length && A[i] === B[j]) { out.push(["ok", A[i]]); i++; j++; }
    else if (j < B.length && (i >= A.length || L[i][j + 1] >= L[i + 1][j])) { out.push(["extra", B[j]]); j++; }
    else { out.push(["miss", A[i]]); i++; }
  }
  return { out, score: A.length ? L[0][0] / A.length : 0, perfect: L[0][0] === A.length && B.length === A.length };
}
function startDict() {
  D = { list: shuffle(DICTATION[S.level]).slice(0, 6), i: 0, result: null, right: 0, draft: "" };
  renderDict();
}
function renderDict() {
  if (!D) return startDict();

  if (D.i >= D.list.length) {

      <button class="btn primary" id="d-again">Novo ditado</button></div>`;
    document.getElementById("d-again").onclick = startDict;
    return;
  }
  const [en, pt] = D.list[D.i];
  const r = D.result;
  $view.innerHTML = head + (canSpeak ? "" : `<div class="feedback no"><b>Seu navegador não tem voz em inglês.</b><p>Use o botão "Mostrar frase" para praticar a escrita mesmo assim.</p></div>`) + `
    <div class="row">
      <button class="btn primary" id="d-play" ${canSpeak ? "" : "disabled"}>${SPEAK_ICON.replace("<svg", '<svg style="width:16px;height:16px;fill:currentColor;vertical-align:-3px"')} Tocar frase</button>
      <button class="btn" id="d-slow" ${canSpeak ? "" : "disabled"}>Tocar devagar</button>
      ${!canSpeak && !r ? `<button class="btn" id="d-show">Mostrar frase</button>` : ""}
    </div>

      <input id="d-input" class="dict-input" autocomplete="off" autocapitalize="off" spellcheck="false" ${r ? "readonly" : ""} value="${esc(D.draft)}">
      ${r ? "" : `<div class="row"><button class="btn primary" type="submit">Conferir</button></div>`}
    </form>
    ${r ? `<div class="feedback ${r.perfect ? "ok" : "no"}">
        <b>${r.perfect ? "Perfeito!" : `Você acertou ${Math.round(r.score * 100)}% das palavras.`}</b>
        <div class="diff">${r.out.map(([t, w]) => `<span class="w-${t}">${esc(w)}</span>`).join(" ")}</div>
        <p><b>${esc(en)}</b><br><span class="hint">${esc(pt)}</span></p>
      </div>
      <p class="hint">Em amarelo: palavras que faltaram. Riscadas: palavras que não estavam na frase.</p>
      <div class="row"><button class="btn primary" id="d-next">Próxima frase</button></div>` : ""}`;
  document.getElementById("d-play").onclick = () => speak(en);

/* ---------- Pronúncia ---------- */

    }).join('<span class="dot" aria-hidden="true">·</span>')}</div>
    ${answered ? `<div class="feedback ${P.picked === st ? "ok" : "no"}"><b>${P.picked === st ? "Certo!" : "A tônica é em " + esc(syl[st]) + "."}</b>
        <p>${syl.map((s, k) => k === st ? `<span class="mark"><b>${esc(s.toUpperCase())}</b></span>` : esc(s)).join("-")}${note ? `<br>${esc(note)}` : ""}</p></div>
      <div class="row" style="justify-content:flex-end"><button class="btn primary" id="s-next">Próxima <kbd>enter</kbd></button></div>`
      : `<p class="hint">Dica: ouça a palavra e procure a sílaba mais longa e mais alta.</p>`}`;
  document.getElementById("s-say").onclick = () => speak(w);
  $view.querySelectorAll(".syl").forEach(x => x.onclick = () => pickStress(+x.dataset.k));
  const nb = document.getElementById("s-next");
  if (nb) { nb.onclick = () => { P.i++; P.picked = null; renderPron(); }; nb.focus(); }
}
function pickStress(k) {
  if (P.picked !== null || k >= P.items[P.i][1].length) return;
  P.picked = k;
  const ok = k === P.items[P.i][2];
  if (ok) P.right++;
  addXP(ok ? 3 : 1, ok);
  speak(P.items[P.i][0]);
  renderPron();
}
function renderSpeak(head) {
  const [en, pt] = P.items[P.i];
  const r = P.result;
  const micOk = SR && !micBlocked;
  $view.innerHTML = head + `
    <div style="display:grid;gap:6px"><p class="sentence" style="margin:0"><b>${esc(en)}</b></p><span class="hint">${esc(pt)}</span></div>
    <div class="row">
      <button class="btn" id="k-play" ${canSpeak ? "" : "disabled"}>${SPEAK_ICON.replace("<svg", '<svg style="width:16px;height:16px;fill:currentColor;vertical-align:-3px"')} Ouvir modelo</button>
      <button class="btn" id="k-slow" ${canSpeak ? "" : "disabled"}>Devagar</button>
      ${micOk && !r ? `<button class="btn primary" id="k-mic">${P.listening ? "Ouvindo… fale agora" : "Falar"}</button>` : ""}
    </div>
    ${P.msg ? `<div class="feedback no"><p style="margin:0">${P.msg}</p></div>` : ""}
    ${r ? `<div class="feedback ${r.perfect ? "ok" : "no"}">
        <b>${r.perfect ? "Perfeito! Entendi tudo." : `Entendi ${Math.round(r.score * 100)}% das palavras.`}</b>
        <div class="diff">${r.out.map(([t, w]) => `<span class="w-${t}">${esc(w)}</span>`).join(" ")}</div>
        <p class="hint">Entendi: “${esc(r.heard)}”</p></div>
      <div class="row spread"><button class="btn" id="k-retry">Tentar de novo</button><button class="btn primary" id="k-next">Próxima frase</button></div>`
    : !micOk ? `<p class="hint">Ouça o modelo, repita em voz alta algumas vezes e depois avalie como foi.</p>
      <div class="row"><button class="btn bad" id="k-bad">Preciso treinar</button><button class="btn good" id="k-good">Falei bem</button></div>` : ""}
    ${r ? `<p class="hint">Em amarelo: palavras que o reconhecimento não entendeu. Tente falar essas com mais clareza.</p>` : ""}`;
  document.getElementById("k-play").onclick = () => speak(en);
  document.getElementById("k-slow").onclick = () => speak(en, true);
  const mb = document.getElementById("k-mic"); if (mb) mb.onclick = () => listen(en);
  const next = () => { P.i++; P.result = null; P.msg = ""; renderPron(); };
  const nb = document.getElementById("k-next"); if (nb) nb.onclick = next;
  const rb = document.getElementById("k-retry"); if (rb) rb.onclick = () => { P.result = null; P.msg = ""; renderPron(); };
  const gb = document.getElementById("k-good"); if (gb) gb.onclick = () => { P.right++; addXP(3, true); next(); };
  const bb = document.getElementById("k-bad"); if (bb) bb.onclick = () => { addXP(1, false); next(); };
}
function listen(target) {
  if (P.listening) { try { rec.stop(); } catch (e) {} return; }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  rec = new SR();
  rec.lang = "en-US"; rec.interimResults = false; rec.maxAlternatives = 3;
  const mine = P;
  rec.onresult = e => {
    if (P !== mine) return;
    const alts = Array.from(e.results[0]).map(a => a.transcript);
    const best = alts.map(h => Object.assign(diffWords(target, h), { heard: h })).sort((x, y) => y.score - x.score)[0];
    P.result = best; P.msg = "";
    if (best.perfect) P.right++;
    addXP(best.perfect ? 8 : Math.round(best.score * 4), best.perfect);
  };
  rec.onerror = e => {
    if (P !== mine) return;
    if (e.error === "not-allowed" || e.error === "service-not-allowed" || e.error === "audio-capture") {
      micBlocked = true;
      P.msg = "O microfone não está disponível aqui. Para ter a correção automática, abra o arquivo index.html direto no Chrome ou no Edge e permita o microfone. Enquanto isso, use a avaliação abaixo.";
    } else if (e.error === "no-speech") P.msg = "Não ouvi nada. Toque em Falar e leia a frase logo em seguida.";
    else if (e.error !== "aborted") P.msg = "O reconhecimento de voz falhou. Tente de novo.";
  };
  rec.onend = () => { if (P !== mine) return; P.listening = false; rec = null; renderPron(); };
  try { rec.start(); P.listening = true; P.msg = ""; renderPron(); }
  catch (e) { micBlocked = true; P.msg = "Não consegui ligar o microfone neste navegador."; renderPron(); }
}

/* ---------- Nível ---------- */
function renderLevels() {
  document.getElementById("levels").innerHTML = Object.entries(LEVELS).map(([k, l]) => {
    const ws = allWords(k), m = ws.filter(w => box(w.en) >= 4).length;
    return `<button class="lvl" role="radio" data-level="${k}" aria-checked="${+k === +S.level}">
      <b>${l.name}</b><span class="cefr">${l.cefr}</span>
      <span class="meter"><span class="progress"><i style="width:${100 * m / ws.length}%"></i></span><span>${m}/${ws.length}</span></span>
    </button>`;
  }).join("");
}
document.getElementById("levels").onclick = e => {
  const b = e.target.closest("[data-level]");
  if (!b || +b.dataset.level === +S.level) return;
  S.level = +b.dataset.level; save();
  C = Q = G = D = null;
  if (rec) { try { rec.abort(); } catch (e) {} rec = null; }
  P = null;
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  renderLevels(); go(S.tab);
};

/* ---------- Navegação ---------- */
const VIEWS = { home: viewHome, cards: renderCards, quiz: renderQuiz, grammar: renderGrammar, dict: renderDict, pron: renderPron };
function go(tab) {
  if (!VIEWS[tab]) tab = "home";
  S.tab = tab; save();
  document.querySelectorAll("nav button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  VIEWS[tab]();
}
document.querySelector("nav").onclick = e => { const b = e.target.closest("button[data-tab]"); if (b) go(b.dataset.tab); };
$view.addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

document.addEventListener("keydown", e => {
  if (e.target.matches("input, select, textarea") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (S.tab === "cards" && C && C.i < C.deck.length) {
    if (e.key === " " && !C.flipped) { e.preventDefault(); C.flipped = true; renderCards(); }
    else if (C.flipped && e.key === "1") grade(false);
    else if (C.flipped && e.key === "2") grade(true);
  } else if (S.tab === "quiz" && Q && Q.picked === null && /^[1-4]$/.test(e.key)) pickQuiz(+e.key - 1);
  else if (S.tab === "grammar" && G && G.picked === null && /^[1-4]$/.test(e.key)) pickGrammar(+e.key - 1);
  else if (S.tab === "pron" && P && P.i < P.items.length && P.picked === null && /^[1-9]$/.test(e.key)) {
    if (P.mode === "pairs" && +e.key <= 2) pickPair(+e.key - 1);
    else if (P.mode === "stress") pickStress(+e.key - 1);
  }
});

/* ---------- App instalável ---------- */
const installable = !!document.querySelector('link[rel="manifest"]') && "serviceWorker" in navigator && /^https?:$/.test(location.protocol);
if (installable) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
(function setupInstall() {
  const box = document.getElementById("install"), btn = document.getElementById("install-btn"), hint = document.getElementById("install-hint");
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (standalone || !installable) return;
  let deferred = null;
  window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); deferred = e; box.hidden = false; });
  window.addEventListener("appinstalled", () => { box.hidden = true; });
  btn.onclick = async () => {
    if (!deferred) return;
    deferred.prompt();
    try { await deferred.userChoice; } catch (e) {}
    deferred = null; box.hidden = true;
  };
  // iPhone e iPad não têm botão de instalação: mostra o caminho pelo Safari.
  if (/iphone|ipad|ipod/i.test(navigator.userAgent)) {
    hint.textContent = "No Safari, toque em Compartilhar e depois em \"Adicionar à Tela de Início\".";
    btn.hidden = true; box.hidden = false;
  }
})();

renderHeader();
renderLevels();
go(location.hash.slice(1) || S.tab);
</script>
